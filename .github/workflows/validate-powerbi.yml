name: Validate Power BI repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Repository validation
        run: python scripts/validate_powerbi_repo.py .
