name: Power BI Desktop E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "templates/pbip-starter/**"
      - "scripts/powerbi_desktop_e2e.ps1"
      - "tests/test_powerbi_desktop_e2e_contract.py"
      - ".github/workflows/powerbi-desktop-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "templates/pbip-starter/**"
      - "scripts/powerbi_desktop_e2e.ps1"
      - "tests/test_powerbi_desktop_e2e_contract.py"
      - ".github/workflows/powerbi-desktop-e2e.yml"

permissions:
  contents: read

concurrency:
  group: powerbi-desktop-e2e-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-e2e:
    name: Open PBIP in real Power BI Desktop
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      TARGET_SHA: \${{ github.event.pull_request.head.sha || github.sha }}
      CORRELATION_ID: powerbi-desktop-e2e-\${{ github.run_id }}-\${{ github.run_attempt }}

    steps:
      - name: Checkout immutable target SHA
        uses: actions/checkout@v4
        with:
          ref: \${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify repository validator before Desktop
        shell: powershell
        run: python scripts/validate_powerbi_repo.py .

      - name: Install Power BI Desktop and open PBIP
        shell: powershell
        run: .\scripts\powerbi_desktop_e2e.ps1 -ExpectedSha "\${{ env.TARGET_SHA }}" -CorrelationId "\${{ env.CORRELATION_ID }}"

      - name: Upload sanitized E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-desktop-e2e-\${{ github.run_id }}
          path: \${{ runner.temp }}/powerbi-desktop-e2e/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish E2E summary
        if: always()
        shell: powershell
        run: |
          $path = Join-Path "\${{ runner.temp }}" "powerbi-desktop-e2e\evidence.json"
          if (-not (Test-Path -LiteralPath $path)) {
            throw "E2E evidence file missing"
          }
          $evidence = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          "## Power BI Desktop E2E" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Status: $($evidence.status)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- SHA: $($evidence.github_sha)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Power BI: $($evidence.powerbi.installed_version)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Semantic engine: $($evidence.powerbi.semantic_engine_started)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Local PBIP state: $($evidence.project.local_settings_created_count)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: $($evidence.production_touched)" | Add-Content $env:GITHUB_STEP_SUMMARY
