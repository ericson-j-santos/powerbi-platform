name: Power BI Desktop E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "templates/pbip-starter/**"
      - "scripts/powerbi_desktop_e2e.ps1"
      - "scripts/new_powerbi_project.py"
      - "tests/test_powerbi_desktop_e2e_contract.py"
      - "tests/test_new_powerbi_project.py"
      - ".github/workflows/powerbi-desktop-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "templates/pbip-starter/**"
      - "scripts/powerbi_desktop_e2e.ps1"
      - "scripts/new_powerbi_project.py"
      - "tests/test_powerbi_desktop_e2e_contract.py"
      - "tests/test_new_powerbi_project.py"
      - ".github/workflows/powerbi-desktop-e2e.yml"

permissions:
  contents: read

concurrency:
  group: powerbi-desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-e2e:
    name: Open PBIP in real Power BI Desktop
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CORRELATION_ID: powerbi-desktop-e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout immutable target SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify repository validator before Desktop
        shell: powershell
        run: python scripts/validate_powerbi_repo.py .

      - name: Generate PBIP consumer fixture
        shell: powershell
        run: |
          $output = Join-Path "${{ runner.temp }}" "GeneratedE2E"
          python scripts/new_powerbi_project.py --name GeneratedE2E --output $output
          python scripts/validate_powerbi_repo.py $output
          $pbip = Join-Path $output "GeneratedE2E.pbip"
          if (-not (Test-Path -LiteralPath $pbip -PathType Leaf)) {
            throw "Generated PBIP fixture missing"
          }
          "GENERATED_PBIP=$pbip" | Add-Content $env:GITHUB_ENV

      - name: Download pinned Power BI Desktop
        shell: powershell
        run: .\scripts\powerbi_desktop_e2e.ps1 -Mode download -ExpectedSha "${{ env.TARGET_SHA }}" -CorrelationId "${{ env.CORRELATION_ID }}" -ProjectFile "$env:GENERATED_PBIP"

      - name: Install pinned Power BI Desktop
        shell: powershell
        run: .\scripts\powerbi_desktop_e2e.ps1 -Mode install -ExpectedSha "${{ env.TARGET_SHA }}" -CorrelationId "${{ env.CORRELATION_ID }}" -ProjectFile "$env:GENERATED_PBIP"

      - name: Open generated PBIP in Power BI Desktop
        shell: powershell
        run: .\scripts\powerbi_desktop_e2e.ps1 -Mode open -ExpectedSha "${{ env.TARGET_SHA }}" -CorrelationId "${{ env.CORRELATION_ID }}" -ProjectFile "$env:GENERATED_PBIP"

      - name: Upload sanitized E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: powerbi-desktop-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/powerbi-desktop-e2e/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish E2E summary
        if: always()
        shell: powershell
        run: |
          $path = Join-Path "${{ runner.temp }}" "powerbi-desktop-e2e\evidence.json"
          if (-not (Test-Path -LiteralPath $path)) {
            throw "E2E evidence file missing"
          }
          $evidence = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          "## Power BI Desktop E2E" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Status: $($evidence.status)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- SHA: $($evidence.github_sha)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Power BI: $($evidence.powerbi.installed_version)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Semantic engine: $($evidence.powerbi.semantic_engine_started)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Local PBIP state: $($evidence.project.local_settings_created_count)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: $($evidence.production_touched)" | Add-Content $env:GITHUB_STEP_SUMMARY
